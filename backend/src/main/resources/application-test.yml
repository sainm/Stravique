spring:
  datasource:
    url: ${STRAVIQUE_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/stravique_test}
    username: ${STRAVIQUE_DB_USER:${user.name}}
    password: ${STRAVIQUE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

stravique:
  scan:
    allowed-roots:
      - ""
  cors:
    allowed-origins: http://localhost:5173
  transformation:
    backup-directory: build/test-transformation-backups
