name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stravique
          POSTGRES_PASSWORD: stravique
          POSTGRES_DB: stravique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stravique -d stravique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STRAVIQUE_DB_URL: jdbc:postgresql://127.0.0.1:5432/stravique
      STRAVIQUE_DB_USER: stravique
      STRAVIQUE_DB_PASSWORD: stravique
      STRAVIQUE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/stravique_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create test database
        env:
          PGPASSWORD: stravique
        run: psql -h 127.0.0.1 -U stravique -d stravique -c "CREATE DATABASE stravique_test"

      - name: Check comment language
        run: python3 scripts/check_comments.py

      - name: Test backend
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build standalone jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: End-to-end verification
        run: ./scripts/e2e.sh
